  interval: 1m
  conditions:
  - '[STATUS] == 200'
  alerts:
  - type: telegram
- name: Alloy
  group: observabilty
  url: https://alloy.deepzide.com/ready
  interval: 1m
  conditions:
  - '[STATUS] == 200'
  alerts:
