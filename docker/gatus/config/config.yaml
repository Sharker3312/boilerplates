# Gatus status-page configuration - SOURCE OF TRUTH (GitOps).
# Live status.deepzide.com deploys this file via Coolify (Sharker3312/boilerplates, main).
# Groups: Bots | API | Third-Party | Infra - Deepzide | Frontend
# Apacha endpoints intentionally removed (no longer monitored).
# Secrets resolve from container environment (see .env.example):
#   SMTP2GO_USER, SMTP2GO_PASSWORD  - email alert delivery
#   PROVIDERS_API_KEY               - ProvidersMonitorLambda Function URL
web:
  port: 8080
storage:
  type: sqlite
  path: /data/data.db
alerting:
  email:
    from: alerts@notifications.deepzide.com
    username: ${SMTP2GO_USER}
    password: ${SMTP2GO_PASSWORD}
    host: mail.smtp2go.com
    port: 2525
    to: sharker3312@gmail.com,lesterdprez.work@gmail.com
endpoints:
- name: Cheese - Bot
  group: Bots
  url: https://cheese-bot.deepzide.com/
  interval: 1m
  conditions:
  - '[STATUS] == 200'
  alerts:
  - type: email
- name: Cheese Bot - Develop
  group: Bots
  url: https://w.cheese-bot-develop.deepzide.com/health
  interval: 1m
  conditions:
  - '[STATUS] == 200'
  - '[BODY].status == healthy'
  - '[RESPONSE_TIME] < 3000'
  - '[CERTIFICATE_EXPIRATION] > 168h'
  alerts:
  - type: email
- name: Viventi - Bot
  group: Bots
  url: https://bot.viventi.app/
  interval: 1m
  conditions:
  - '[STATUS] == 200'
  alerts:
  - type: email
- name: Viventi Bot - Develop
  group: Bots
  url: https://w.viventi-multibot-bot-develop.deepzide.com/health
  interval: 1m
  conditions:
  - '[STATUS] == 200'
  - '[BODY].status == healthy'
  - '[RESPONSE_TIME] < 3000'
  - '[CERTIFICATE_EXPIRATION] > 168h'
  alerts:
  - type: email
- name: API - Dev
  group: API
  url: https://tks6dy6ll3.execute-api.us-east-1.amazonaws.com/health
  interval: 1m
  conditions:
  - '[STATUS] == 200'
  alerts:
  - type: email
- name: API - Prod
  group: API
  url: https://tks6dy6ll3.execute-api.us-east-1.amazonaws.com/health
  interval: 1m
  conditions:
  - '[STATUS] == 200'
  alerts:
  - type: email
- name: HeyYou - Backend
  group: API
  url: https://api.heyyouapp.com
  interval: 1m
  conditions:
  - '[STATUS] == 200'
  - '[RESPONSE_TIME] < 3000'
  - '[CERTIFICATE_EXPIRATION] > 168h'
  alerts:
  - type: email
- name: Cargo Expreso
  group: Third-Party
  url: https://jzgcutczww757eiklpwfi46m4a0xhtqe.lambda-url.us-east-1.on.aws/?provider=cargo_expreso
  interval: 5m
  headers:
    x-api-key: ${PROVIDERS_API_KEY}
  conditions:
  - '[STATUS] == 200'
  alerts:
  - type: email
- name: DigiFact
  group: Third-Party
  url: https://jzgcutczww757eiklpwfi46m4a0xhtqe.lambda-url.us-east-1.on.aws/?provider=digifact
  interval: 5m
  headers:
    x-api-key: ${PROVIDERS_API_KEY}
  conditions:
  - '[STATUS] == 200'
  alerts:
  - type: email
- name: SMTP2GO - Upstream
  group: Third-Party
  url: tcp://mail.smtp2go.com:2525
  interval: 1m
  conditions:
  - '[CONNECTED] == true'
  alerts:
  - type: email
- name: Alloy
