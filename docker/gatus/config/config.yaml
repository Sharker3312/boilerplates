web:
  port: 8080
storage:
  type: sqlite
  path: /data/data.db
alerting:
  telegram:
    token: REEMPLAZAR-TELEGRAM-BOT-TOKEN
    id: REEMPLAZAR-TELEGRAM-CHAT-ID
    default-alert:
      enabled: true
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 2
endpoints:
- name: Apacha - Bot
  group: Bot
  url: https://apachabot.deepzide.com/
  interval: 1m
  conditions:
  - '[STATUS] == 200'
  alerts:
  - type: telegram
- name: Cheese - Bot
  group: Bot
  url: https://cheese-bot.deepzide.com/
  interval: 1m
  conditions:
  - '[STATUS] == 200'
  alerts:
  - type: telegram
- name: Viventi - Bot
  group: Bot
  url: https://bot.viventi.app/
  interval: 1m
  conditions:
  - '[STATUS] == 200'
  alerts:
  - type: telegram
- name: Apacha - Staging
  group: ERP
  url: https://erp-apacha-dev.deepzide.com
  interval: 1m
  conditions:
  - '[STATUS] == 200'
  alerts:
  - type: telegram
- name: Dermagroup - Prod
  group: ERP
  url: https://erp-dermagroup.deepzide.com
