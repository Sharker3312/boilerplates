- name: Cheese Bot - Develop
  group: Bot
  url: https://w.cheese-bot-develop.deepzide.com/health
  interval: 1m
  conditions:
  - '[STATUS] == 200'
  - '[BODY].status == healthy'
  - '[RESPONSE_TIME] < 3000'
  - '[CERTIFICATE_EXPIRATION] > 168h'
  alerts:
  - type: telegram
- name: Viventi Bot - Develop
  group: Bot
  url: https://w.viventi_multibot-bot-develop.deepzide.com/health
