services:
  gatus:
    image: twinproduction/gatus:latest
    container_name: gatus
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      # Alert-delivery and provider secrets, resolved by Gatus config ${VAR}
      # expansion. Copy .env.example to .env (Coolify reads it automatically).
      SMTP2GO_USER: ${SMTP2GO_USER}
      SMTP2GO_PASSWORD: ${SMTP2GO_PASSWORD}
      PROVIDERS_API_KEY: ${PROVIDERS_API_KEY}
    volumes:
      - ./config:/config:ro
      - ./data:/data
